sonar.organization=overnightworks
sonar.projectKey=overnightworks_speech
sonar.projectName=speech
sonar.sources=src,packages/client/src,providers/provider-contract/src,providers/qwen/src,packages/browser/src
sonar.tests=tests,providers/qwen/tests,packages/browser/src
# The browser package keeps its tests beside its sources; each file counts on one side only.
sonar.exclusions=packages/browser/src/**/*.test.ts
sonar.test.inclusions=tests/**,providers/qwen/tests/**,packages/browser/src/**/*.test.ts
# why: generated from speech_client.wire and speech_client.relay by scripts/generate_browser_wire.py, not maintained source.
sonar.cpd.exclusions=packages/browser/src/hop.ts
sonar.python.version=3.14
sonar.sourceEncoding=UTF-8
sonar.python.coverage.reportPaths=coverage-root.xml,coverage-qwen.xml
sonar.javascript.lcov.reportPaths=coverage-browser.lcov
