[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "overnightworks-speech-client"
version = "0.22.2"
description = "The wire between an app and the speech service: the request, the refusals, the bounded speaking call, the bounded health fetch, the live hearing session and the relay of a browser's live audio to it."
requires-python = ">=3.14"
dependencies = [
    "overnightworks-logline>=0.5,<2",
    "pydantic>=2.13,<3",
    "websockets>=17.4,<18",
]

[dependency-groups]
dev = ["overnightworks-logline @ git+https://github.com/overnightworks/logline@v0.6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/speech_client"]
