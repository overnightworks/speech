[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "overnightworks-speech-runtime-client"
version = "0.4.0"
description = "The wire between an app and the speech service: the request, the refusals, the bounded speaking call and the bounded health fetch."
requires-python = ">=3.14"
dependencies = ["pydantic>=2.13,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/speech_runtime_client"]
