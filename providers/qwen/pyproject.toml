[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "overnightworks-speech-qwen"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "overnightworks-speech-provider-contract",
    "vllm==0.32.0",
    "vllm-omni==0.32.0",
]

[project.scripts]
speech-qwen-worker = "speech_qwen.__main__:main"

[tool.uv.sources]
overnightworks-speech-provider-contract = { path = "../provider-contract", editable = true }

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "pytest-xdist==3.8.0", "ruff==0.17.4"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# vllm-omni lists openai-whisper, but its only import is the Ming model's
# processor, which the Qwen path never reaches; the override drops it.
override-dependencies = ["openai-whisper ; sys_platform == 'never'"]

[tool.hatch.build.targets.wheel]
packages = ["src/speech_qwen"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with ruff format
    "CPY001", # the copyright header is not used here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # pytest checks with assert
    "D103", # the test name states the behaviour
]

[tool.ruff.lint.flake8-tidy-imports]
# The model libraries stay unloaded until the worker loads.
banned-module-level-imports = [
    "huggingface_hub",
    "speech_qwen.model",
    "torch",
]
