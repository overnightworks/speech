[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "overnightworks-speech-runtime-provider-contract"
version = "0.5.0"
requires-python = ">=3.14"

[tool.hatch.build.targets.wheel]
packages = ["src/speech_runtime_provider_contract"]

[tool.ruff]
target-version = "py314"
src = ["src", "../qwen/src", "../qwen/tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with ruff format
    "CPY001", # the copyright header is not used here
]
