[gate]
mandatory_jobs = ["Speech: lint, tests", "Speech: Qwen provider", "Speech: image", "Speech: gpu image build / Build", "keycloak-token-shapes", "Speech: browser package", "Speech: browser capture flow"]

[[root.allow]]
entry = "deploy/"
reason = "the settings the image bakes, so the dated tag fixes whom the service trusts"
ends = "overnightworks/quality#1104"

[[layout.allow]]
path = "tests/test_page_coverage_support.py"
rule = "test-layout"
reason = "it tests the browser-flow coverage harness in tests/support, which is no module of src/speech_service"
ends = "overnightworks/quality#1101"

[[python.allow]]
path = "providers/qwen/pyproject.toml"
reason = "vllm-omni 0.32.0 declares Requires-Python <3.14,>=3.11, so no locked wheel set reaches 3.14"

[[python.allow]]
path = "providers/provider-contract/pyproject.toml"
reason = "the Qwen launcher imports it on Python 3.12, where vllm-omni 0.32.0 (Requires-Python <3.14,>=3.11) caps it"

# providers/qwen/uv.lock: advisories no relock reaches
[[advisories.allow]]
id = "PYSEC-2026-3804"
lock = "providers/qwen/uv.lock"
until = 2027-01-31
date = 2026-10-21
item = "overnightworks/speech#2"
reason = "accelerate 1.12.0: vllm-omni 0.32.0 pins accelerate==1.12.0; local TTS server, text over a local socket"

[[advisories.allow]]
id = "GHSA-h35f-9h28-mq5c"
lock = "providers/qwen/uv.lock"
until = 2027-01-31
date = 2026-11-13
item = "overnightworks/speech#2"
reason = "setuptools 80.10.2: vllm 0.32.0 requires setuptools<81.0.0 and the fix starts at 83.0.0; it concerns building sdists, local TTS server, text over a local socket"

[[advisories.allow]]
id = "GHSA-xmj3-9gf7-h52w"
lock = "providers/qwen/uv.lock"
until = 2027-01-31
date = 2026-11-13
item = "overnightworks/speech#2"
