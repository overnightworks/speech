version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Our libraries come from Git or this repository; a PyPI package of the same name is not ours
      - dependency-name: "overnightworks-*"
    groups:
      uv-speech:
        update-types: [minor, patch]
        # GPU/model-coupled pins stay single PRs so each lands with its own speech/GPU proof
        exclude-patterns:
          - "nvidia-*"
          - "numpy"
          - "faster-whisper"
          - "piper-tts"
  - package-ecosystem: uv
    directory: /providers/qwen
    schedule:
      interval: weekly
    ignore:
      # Our libraries come from Git or this repository; a PyPI package of the same name is not ours
      - dependency-name: "overnightworks-*"
    groups:
      uv-qwen:
        update-types: [minor, patch]
        # The model stack stays single PRs so each lands with its own GPU proof
        exclude-patterns:
          - "nvidia-*"
          - "numpy"
          - "torch"
          - "torchaudio"
          - "transformers"
          - "accelerate"
          - "vllm"
          - "vllm-omni"
  - package-ecosystem: npm
    directory: /packages/browser
    schedule:
      interval: weekly
    # @vitest/coverage-v8 requires exactly the installed vitest as its peer, so both move in one update.
    groups:
      vitest:
        patterns: ["vitest", "@vitest/*"]
