name: gpu image build

on:
  workflow_call:

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The gpu image is larger than the standard runner's root disk holds: drop
      # the toolchains the build never reads and keep Docker's data on the
      # larger temporary disk.
      - name: Free disk and move Docker's data root to the temporary disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt

      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The default docker driver exports every build into the docker store; a
      # container builder can discard the result, which nothing reads.
      - name: Set up the builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the gpu stage without exporting or pushing it
        run: docker buildx build --target gpu --output type=cacheonly --provenance=false .
