name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A pull request collapses onto its newest push, but every push to main keeps a
# group of its own so no landing is ever cancelled by the next one.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  speech:
    name: "Speech: lint, tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          version: "0.10.9"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check source
        run: uv run --locked ruff check

      - name: Check formatting
        run: uv run --locked ruff format --check

      - name: Test
        run: uv run --locked pytest -q -n auto --cov --cov-report=xml:coverage-root.xml

      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-root
          path: coverage-root.xml

  qwen-provider:
    name: "Speech: Qwen provider"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: providers/qwen
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: providers/qwen/uv.lock
          version: "0.10.9"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check source
        run: uv run --locked ruff check src tests ../provider-contract/src

      - name: Check formatting
        run: uv run --locked ruff format --check src tests ../provider-contract/src

      - name: Test
        working-directory: ${{ github.workspace }}
        run: >-
          uv run --locked --project providers/qwen pytest -q -n auto providers/qwen/tests
          --cov --cov-report=xml:coverage-qwen.xml

      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-qwen
          path: coverage-qwen.xml

  image:
    name: "Speech: image"
    runs-on: ubuntu-24.04
    # The proof holds its own 1800 s cap, build included.
    timeout-minutes: 15
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          version: "0.10.9"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Build the image and prove it on isolated networks
        run: uv run --locked python scripts/prove_image.py

  keycloak-token-shapes:
    name: keycloak-token-shapes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KEYCLOAK_IMAGE: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
      KEYCLOAK_URL: http://localhost:8080
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          version: "0.10.9"

      - name: Start Keycloak with the test realm
        run: |
          docker run --detach --name keycloak --publish 8080:8080 \
            --volume "$GITHUB_WORKSPACE/tests/fixtures/keycloak:/opt/keycloak/data/import:ro" \
            "$KEYCLOAK_IMAGE" start-dev --import-realm

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Wait until the test realm is served
        run: |
          for attempt in $(seq 60); do
            if curl --fail --silent "$KEYCLOAK_URL/realms/speech-test/.well-known/openid-configuration" > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker logs keycloak
          exit 1

      - name: Token shapes and the caller check with real tokens
        # One module against one Keycloak container: its tests share the realm's
        # users and sessions, so workers would race on that state; it stays serial.
        run: uv run --locked pytest -p no:cacheprovider tests/test_callers_keycloak.py -m keycloak -v -rP

      - name: Keycloak log on failure
        if: failure()
        run: docker logs keycloak

      - name: Stop Keycloak
        if: always()
        run: docker rm --force keycloak

  coverage:
    name: "Speech: coverage reports"
    needs:
      - speech
      - qwen-provider
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the two coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Upload the coverage reports for the quality gate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage-*.xml
          if-no-files-found: error

  quality:
    name: quality
    needs:
      - coverage
      - keycloak-token-shapes
      - speech
      - qwen-provider
      - image
    if: always()
    uses: overnightworks/quality/.github/workflows/gate.yml@2d2b68bf3916b34f6f2c72a540c1e3d8a947b750 # v0.10.0
    with:
      coverage-artifact: coverage
    permissions:
      contents: read
      actions: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
