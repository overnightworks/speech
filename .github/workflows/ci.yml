name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A pull request collapses onto its newest push, but every push to main keeps a
# group of its own so no landing is ever cancelled by the next one.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  speech:
    name: "Speech: lint, tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          version: "0.10.9"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check source
        run: uv run --locked ruff check

      - name: Check formatting
        run: uv run --locked ruff format --check

      - name: Test
        run: uv run --locked pytest -q -n auto --cov --cov-report=xml:coverage-root.xml

      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-root
          path: coverage-root.xml

  qwen-provider:
    name: "Speech: Qwen provider"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: providers/qwen
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: providers/qwen/uv.lock
          version: "0.10.9"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check source
        run: uv run --locked ruff check src tests ../provider-contract/src

      - name: Check formatting
        run: uv run --locked ruff format --check src tests ../provider-contract/src

      - name: Test
        working-directory: ${{ github.workspace }}
        run: >-
          uv run --locked --project providers/qwen pytest -q -n auto providers/qwen/tests
          --cov --cov-report=xml:coverage-qwen.xml

      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-qwen
          path: coverage-qwen.xml

  browser-unit:
    name: "Speech: browser package"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/browser
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          package_json_file: packages/browser/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: packages/browser/package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: packages/browser/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm run check

      - name: Pack the tarball and install it into an empty project
        run: node scripts/pack-release.js "$RUNNER_TEMP/release-files"

      - name: Test
        run: pnpm run test:coverage

      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-browser-unit
          path: packages/browser/coverage/coverage-browser-unit.lcov
          if-no-files-found: error

  browser-flow:
    name: "Speech: browser flows"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          version: "0.10.9"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          package_json_file: packages/browser/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: packages/browser/package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: packages/browser/pnpm-lock.yaml

      - name: Build the browser package
        working-directory: packages/browser
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      # apt on the runner can stall on a slow mirror; each attempt is bounded so
      # a stall costs one retry instead of the test budget.
      - name: Install Chromium
        id: install-chromium
        continue-on-error: true
        timeout-minutes: 5
        run: uv run --locked playwright install --with-deps chromium

      - name: Install Chromium again
        if: steps.install-chromium.outcome == 'failure'
        timeout-minutes: 3
        run: |
          # The timed-out attempt leaves its apt-get running and holding the dpkg lock.
          sudo pkill -x apt-get || true
          sudo pkill -x apt || true
          while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 1; done
          uv run --locked playwright install --with-deps chromium

      - name: Run the browser flows
        timeout-minutes: 8
        env:
          SPEECH_BROWSER_COVERAGE_DIR: ${{ runner.temp }}/browser-coverage-raw
        # Each worker drives real-time audio graphs; two fit the runner without
        # starving the render threads.
        run: uv run --locked pytest -q -n 2 -m browser tests/test_wire_route_browser_capture.py tests/test_wire_route_browser_player.py

      - name: Convert the page coverage to lcov
        working-directory: packages/browser
        env:
          SPEECH_BROWSER_COVERAGE_DIR: ${{ runner.temp }}/browser-coverage-raw
        run: node scripts/page-coverage-report.js "${SPEECH_BROWSER_COVERAGE_DIR}"

      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-browser-flow
          path: packages/browser/coverage/flow/coverage-browser-flow.lcov
          if-no-files-found: error

  image:
    name: "Speech: image"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          version: "0.10.9"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Build the image and prove it on isolated networks
        run: uv run --locked python scripts/prove_image.py

  keycloak-token-shapes:
    name: keycloak-token-shapes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KEYCLOAK_IMAGE: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
      KEYCLOAK_URL: http://localhost:8080
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          version: "0.10.9"

      - name: Start Keycloak with the test realm
        run: |
          docker run --detach --name keycloak --publish 8080:8080 \
            --volume "$GITHUB_WORKSPACE/tests/fixtures/keycloak:/opt/keycloak/data/import:ro" \
            "$KEYCLOAK_IMAGE" start-dev --import-realm

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Wait until the test realm is served
        run: |
          for attempt in $(seq 60); do
            if curl --fail --silent "$KEYCLOAK_URL/realms/speech-test/.well-known/openid-configuration" > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker logs keycloak
          exit 1

      - name: Token shapes and the caller check with real tokens
        # One small module against one local Keycloak: each xdist worker would
        # rebuild its module-scoped app and gain nothing, so it stays serial.
        run: uv run --locked pytest -p no:cacheprovider tests/test_callers_keycloak.py -m keycloak -v -rP

      - name: Keycloak log on failure
        if: failure()
        run: docker logs keycloak

      - name: Stop Keycloak
        if: always()
        run: docker rm --force keycloak

  coverage:
    name: "Speech: coverage reports"
    needs:
      - speech
      - qwen-provider
      - browser-unit
      - browser-flow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true

      # The two reports name disjoint files, so their concatenation is one valid lcov.
      - name: Merge the browser coverage
        run: cat coverage-browser-unit.lcov coverage-browser-flow.lcov > coverage-browser.lcov

      - name: Upload the coverage reports for the quality gate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage-*.xml
            coverage-browser.lcov
          if-no-files-found: error

  quality:
    name: quality
    needs:
      - coverage
      - keycloak-token-shapes
      - speech
      - qwen-provider
      - image
      - browser-unit
      - browser-flow
    if: always()
    uses: overnightworks/quality/.github/workflows/gate.yml@2d2b68bf3916b34f6f2c72a540c1e3d8a947b750 # v0.10.0
    with:
      coverage-artifact: coverage
    permissions:
      contents: read
      actions: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
