name: Release distributions

# The release of the three Python distributions and the browser package: one
# X.Y.Z, the distributions proven installable by Git pin and the browser package
# packed as a tarball release file at the gated commit, then the git tag. Every
# quality call below is pinned at a quality release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, X.Y.Z"
        required: true
        type: string

concurrency:
  group: release-distributions
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: Gate
    uses: overnightworks/quality/.github/workflows/release-gate.yml@be32abeb120d29f75ee7ea456d6e510ae001de04 # v0.12.0
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    with:
      version: ${{ inputs.version }}

  build:
    name: Build
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ needs.gate.outputs.commit }}
    steps:
      - name: Check out the gated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.9"
          enable-cache: false

      - name: Refuse unless every artefact's version equals the version
        run: python3 scripts/check_release.py "$VERSION"

      - name: Install each distribution by its Git pin into an empty project
        id: install
        run: |
          rows=$(python3 scripts/check_release.py --rows)
          python_version=$(cat "$GITHUB_WORKSPACE/.python-version")
          pins=""
          while IFS='|' read -r distribution directory module; do
            fragment=""
            if [ "$directory" != "." ]; then fragment="#subdirectory=$directory"; fi
            repository="git+https://github.com/$GITHUB_REPOSITORY"
            host="$RUNNER_TEMP/host-$module"
            uv init --bare --no-workspace --python "$python_version" "$host"
            (cd "$host" && uv add "$distribution @ $repository@$COMMIT$fragment" && uv run python -c "import $module")
            pins+="- \`$distribution @ $repository@v$VERSION$fragment\`"$'\n'
          done <<<"$rows"
          delimiter="pins-$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          {
            echo "pins<<$delimiter"
            printf '%s' "$pins"
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: packages/browser/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: packages/browser/package.json
          check-latest: true
          package-manager-cache: false

      - name: Pack the browser package and prove its install
        id: pack
        working-directory: packages/browser
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          node scripts/pack-release.js "$RUNNER_TEMP/release-files" | tee -a "$GITHUB_OUTPUT"

      - name: Write the notes
        id: notes
        shell: bash
        env:
          PINS: ${{ steps.install.outputs.pins }}
          FILE: ${{ steps.pack.outputs.file }}
          INTEGRITY: ${{ steps.pack.outputs.integrity }}
        run: |
          if [ -z "$FILE" ] || [ -z "$INTEGRITY" ]; then
            echo "the pack printed no file name or integrity" >&2
            exit 1
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$VERSION/$FILE"
          delimiter="notes-$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          {
            echo "notes<<$delimiter"
            printf 'Install by Git pin at this tag:\n\n%s\n' "$PINS"
            printf "The browser package's tarball, by URL and the integrity pnpm writes into the lockfile:\n\n"
            printf '```text\n%s\n%s\n```\n' "$url" "$INTEGRITY"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files
          if-no-files-found: error

  tag:
    name: Tag
    needs:
      - gate
      - build
    uses: overnightworks/quality/.github/workflows/release-tag.yml@be32abeb120d29f75ee7ea456d6e510ae001de04 # v0.12.0
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      commit: ${{ needs.gate.outputs.commit }}
      notes: ${{ needs.build.outputs.notes }}
      artifact: release-files
