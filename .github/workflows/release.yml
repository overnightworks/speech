name: Release

# The app's release: one dated version, the image built, attested and pushed,
# then the git tag. Every quality call below is pinned at a quality release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, YYYY.MM.DD.N"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: Gate
    uses: overnightworks/quality/.github/workflows/release-gate.yml@2d2b68bf3916b34f6f2c72a540c1e3d8a947b750 # v0.10.0
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    with:
      version: ${{ inputs.version }}
      form: YYYY.MM.DD.N

  image:
    name: Image
    needs: gate
    uses: overnightworks/quality/.github/workflows/image.yml@2d2b68bf3916b34f6f2c72a540c1e3d8a947b750 # v0.10.0
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      version: ${{ inputs.version }}
      push: true

  tag:
    name: Tag
    needs:
      - gate
      - image
    uses: overnightworks/quality/.github/workflows/release-tag.yml@2d2b68bf3916b34f6f2c72a540c1e3d8a947b750 # v0.10.0
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      commit: ${{ needs.gate.outputs.commit }}
