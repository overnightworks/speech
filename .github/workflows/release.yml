name: Release

# The app's release: one dated version, the image built, attested and pushed,
# then the git tag. Every quality call below is pinned at quality's main, because
# no quality tag ships the release path yet.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, YYYY.MM.DD.N"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: Gate
    # quality's main at 7715afe; no quality tag ships the release path yet
    uses: overnightworks/quality/.github/workflows/release-gate.yml@7715afe5c911a00ae3076057691e0b5d4e4a65f7
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    with:
      version: ${{ inputs.version }}
      form: YYYY.MM.DD.N

  image:
    name: Image
    needs: gate
    # quality's main at 7715afe; no quality tag ships the release path yet
    uses: overnightworks/quality/.github/workflows/image.yml@7715afe5c911a00ae3076057691e0b5d4e4a65f7
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      version: ${{ inputs.version }}
      push: true

  tag:
    name: Tag
    needs:
      - gate
      - image
    # quality's main at 7715afe; no quality tag ships the release path yet
    uses: overnightworks/quality/.github/workflows/release-tag.yml@7715afe5c911a00ae3076057691e0b5d4e4a65f7
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      commit: ${{ needs.gate.outputs.commit }}
