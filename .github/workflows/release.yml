name: Release

# The app's release: one dated version, the small image and the gpu image (the
# same version with a `-gpu` suffix) built, attested and pushed, then the git
# tag. Every quality call below is pinned at a quality release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, YYYY.MM.DD.N"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: Gate
    uses: overnightworks/quality/.github/workflows/release-gate.yml@eb140c397e83b8ec4e9ee849453d14efeef4e787 # v0.14.0
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    with:
      version: ${{ inputs.version }}
      form: YYYY.MM.DD.N

  # The small image waits for the gpu build, the likelier to fail, so a failed
  # build leaves no pushed version without its tag.
  image:
    name: Image
    needs:
      - gate
      - image-gpu
    uses: overnightworks/quality/.github/workflows/image.yml@eb140c397e83b8ec4e9ee849453d14efeef4e787 # v0.14.0
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      version: ${{ inputs.version }}
      push: true

  # The gpu image is larger than the standard runner's disk holds, so it builds
  # on the paid larger runner `speech-gpu-build`; only this job uses it.
  image-gpu:
    name: Image (gpu)
    needs: gate
    uses: overnightworks/quality/.github/workflows/image.yml@eb140c397e83b8ec4e9ee849453d14efeef4e787 # v0.14.0
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      version: ${{ inputs.version }}-gpu
      target: gpu
      runner: speech-gpu-build
      push: true

  tag:
    name: Tag
    needs:
      - gate
      - image
      - image-gpu
    uses: overnightworks/quality/.github/workflows/release-tag.yml@eb140c397e83b8ec4e9ee849453d14efeef4e787 # v0.14.0
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      commit: ${{ needs.gate.outputs.commit }}
