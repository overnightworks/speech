# The voices the service offers: one table per voice id. The service's package
# ships this file, which the service reads unless `SPEECH_CATALOGUE_FILE` names
# another; `speech-fetch-voice` fetches the voices it holds at these pins. It
# holds no secret.

# Piper voices: the repository and revision their two files are fetched at, and
# the SHA-256 each file must have. Licences are those on the voice's model card
# at its pinned revision.
[voices.de_DE-thorsten-medium]
engine = "piper"
name = "Thorsten"
languages = ["de"]

[voices.de_DE-thorsten-medium.pin]
repository = "rhasspy/piper-voices"
revision = "b4e358ffcb232591bf73a540e70f7de528e4174a"

